<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app-container">
        <header>
            <h1>Rock Paper Scissors</h1>
            <span class="round-indicator" id="round-indicator">Round 1 of 5</span>
        </header>

        <section class="scoreboard">
            <!-- Player Score -->
            <div class="score-panel">
                <span class="score-name">You</span>
                <span class="score-value" id="player-score">0</span>
                <div class="choice-preview" id="player-choice-preview">?</div>
            </div>

            <div class="vs-badge">VS</div>

            <!-- Computer Score -->
            <div class="score-panel">
                <span class="score-name">Computer</span>
                <span class="score-value" id="computer-score">0</span>
                <div class="choice-preview" id="computer-choice-preview">?</div>
            </div>
        </section>

        <section class="weapons-section">
            <h2 class="section-title">Choose your weapon</h2>
            <div class="weapons-container">
                <button class="weapon-card" id="btn-rock">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2L3 8l2 9 7 3 7-3 2-9-9-6z"/>
                        <path d="M12 2v20M3 8h18M5 17h14"/>
                    </svg>
                    <span>Rock</span>
                </button>
                
                <button class="weapon-card" id="btn-paper">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                        <line x1="10" y1="9" x2="8" y2="9"/>
                    </svg>
                    <span>Paper</span>
                </button>

                <button class="weapon-card" id="btn-scissors">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="6" cy="6" r="3"/>
                        <circle cx="6" cy="18" r="3"/>
                        <line x1="9.8" y1="8.2" x2="20" y2="17"/>
                        <line x1="9.8" y1="15.8" x2="20" y2="7"/>
                    </svg>
                    <span>Scissors</span>
                </button>
            </div>
        </section>

        <section class="result-banner" id="result-banner">
            <p class="result-text" id="result-text">Choose your weapon to start the match!</p>
        </section>
    </div>

    <!-- Game Over Modal Overlay -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-card">
            <span class="modal-emoji" id="modal-emoji">🏆</span>
            <h2 class="modal-title" id="modal-title">You Won!</h2>
            <p class="modal-subtitle" id="modal-subtitle">Great job defeating the computer.</p>
            
            <div class="modal-stats">
                <div class="stat-item">
                    <span class="stat-label">Your Score</span>
                    <span class="stat-value" id="modal-player-score">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">CPU Score</span>
                    <span class="stat-value" id="modal-computer-score">0</span>
                </div>
            </div>

            <button class="btn-restart" id="btn-restart">Play Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
